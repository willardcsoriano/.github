name: Issue labeler

# This repo's own issues, labeled by the shared workflow it publishes
# (label-issues.yml), with the labeler script from this very commit.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    uses: ./.github/workflows/label-issues.yml
    with:
      scripts-ref: ${{ github.sha }}
