name: Lint PR review

# This repo's linter reviewer: the shared lint-review.yml it publishes, run
# from this very commit with actionlint on, plus the labeler's table tests.
# Checks: "lint / review" and "labeler-tests".

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/lint-review.yml
    with:
      actionlint-version: "1.7.12"

  labeler-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/label-issue.test.sh
